repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # mypy runs from the project venv (local hook) so it sees the real
  # runtime deps (click, fastapi, httpx, ...). The upstream mirror ran
  # in an isolated env with a hand-maintained, incomplete
  # additional_dependencies list, which made typed decorators (click)
  # and third-party imports appear untyped. Config (strict, plugins,
  # overrides) is read from pyproject [tool.mypy].
  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict (project venv)
        entry: .venv/bin/mypy
        language: system
        args: ["src/crew_os"]
        pass_filenames: false
        files: ^src/.*\.py$

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.9
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r", "src/"]
        additional_dependencies: ["bandit[toml]"]

  # pip-audit runs against the project's own venv (local hook) so it
  # audits the real installed dependencies. The upstream hook ran in an
  # isolated env and its --disable-pip flag was invalid without -r.
  # No --strict: it treats the skipped editable self-package as a
  # failure; real vulnerabilities still fail the run regardless.
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit (project venv)
        entry: .venv/bin/pip-audit
        language: system
        args: ["--skip-editable"]
        pass_filenames: false
        always_run: true
