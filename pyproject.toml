[project]
name = "textual-crew-os"
version = "1.1.0"
description = "Local AI agents OS with visual dashboard"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "abduaiz" }]
readme = "README.md"

dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "anthropic>=0.43",
    "fastapi>=0.111",
    "starlette>=1.0.1",  # transitive via fastapi; pinned to clear PYSEC-2026-161
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "jinja2>=3.1",
    "structlog>=24.1",
    "psutil>=5.9",
    "nvidia-ml-py>=12.555",
    "aiosqlite>=0.20",
    "click>=8.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=3.7",
    "respx>=0.21",
    "types-psutil",
]
audit = [
    # garak runs in an isolated venv via subprocess (see Stage 4).
    # Listed here only as a marker; do NOT install into the main env.
]

[project.scripts]
crew = "crew_os.cli.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crew_os"]

# ─────────────────────────────── Ruff ───────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pycodestyle + pyflakes
    "I",                  # isort
    "N",                  # pep8-naming
    "UP",                 # pyupgrade
    "B",                  # bugbear
    "SIM",                # simplify
    "S",                  # bandit-lite
    "C4",                 # comprehensions
    "RET",                # return
    "PT",                 # pytest-style
    "ASYNC",              # async correctness
    "TID",                # tidy imports
    "PL",                 # pylint subset
    "RUF",                # ruff-specific
]
ignore = [
    "PLR0913",            # too many arguments — sometimes needed for config
    "PLR2004",            # magic value — overly noisy
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004", "B011", "ASYNC240"]  # test assertions may touch Path
"scripts/**" = ["S603", "S607"]   # subprocess use is intentional and audited
"src/crew_os/core/exceptions.py" = ["N818"]  # domain names: PolicyViolation, AuditChainBroken

[tool.ruff.format]
quote-style = "double"

# ─────────────────────────────── MyPy ───────────────────────────────
[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["pynvml.*", "structlog.*"]
ignore_missing_imports = true

# ─────────────────────────────── Pytest ─────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "integration: requires running Ollama service",
    "slow: takes more than 1s",
    "lab_mode: requires LAB_MODE consent token",
]

# ─────────────────────────────── Coverage ───────────────────────────
[tool.coverage.run]
branch = true
source = ["src/crew_os"]
omit = ["src/crew_os/cli/*", "src/crew_os/web/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

# ─────────────────────────────── Bandit ─────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv", "build", "dist"]
